<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Turner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-teal-50">
    <header class="bg-white stroke-2 stroke-slate-200">
        <div>
            <h1 class="grid grid-cols-3 font-inter font-bold text-2xl text-slate-900 ml-2 align-top">Page Turner</h1>
            
                <nav class="grid grid-cols-2 ml-290 gap-3 font-medium text-base text-slate-600 ">
                    <h2>Browse</h2>
                    <h2>Hours</h2>
                </nav>
        </div>
    </header>

    <main>

        <div>
            <div>
                <h3 class="font-inter font-bold text-3xl ml-3">Staff Picks</h3>
                <p class="font-inter font-regular text-lg text-slate-600 ml-3">What we are pressing into people's hands this month.</p>
            </div>
            <div class="flex flex-row justify-between mt-15 ml-30 mr-30">
                <div class="bg-white">
                <img src="/assets/moby.jpg">
                <h1>Moby Dick</h1>
                <h2>Herman Melville</h2>
                <h3>$12</h3>
                </div>
                <div class="bg-white">
                <img src="/assets/frank.jpg">
                <h1>Frankenstein</h1>
                <h2>Mary Shirley</h2>
                <h3>$14</h3>
                </div>
                <div class="bg-white ">
                <img src="/assets/call.jpg">
                <h1>Call of the Wild</h1>
                <h2>Jack London</h2>
                <h3>$9</h3>
                </div>
            </div>




        </div>




    </main>

    <footer>

        <div class="flex flex-col bg-teal-700 mt-10 mb-5 rounded-8 w-3xs ml-130">
            <h2 class="flex flex-col text-center font-inter font-semibold text-lg text-white">Browse The Shelves</h2>
        </div>


    </footer>

</body>

</html>
