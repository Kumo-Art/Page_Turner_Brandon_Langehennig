<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Turner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-teal-50">
    <header class="bg-white stroke-2 stroke-slate-200">
        <div>
            <h1 class="grid grid-cols-3 font-inter font-bold text-2xl text-slate-900 ml-2 align-top">Page Turner</h1>

            <nav class="grid grid-cols-2 ml-290 gap-3 font-medium text-base text-slate-600 ">
                <h2>Browse</h2>
                <h2>Hours</h2>
            </nav>
        </div>
    </header>

    <main>

        <div>
            <div>
                <h3 class="font-inter font-bold text-3xl ml-3">Staff Picks</h3>
                <p class="font-inter font-regular text-lg text-slate-600 ml-3">What we are pressing into people's hands
                    this month.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-3 xl:grid-cols-3 gap-4 ml-3 mt-10 rounded-lg">
                <div class="bg-white flex-row flex-col-3 p-6 gap-4 mr-70 rounded-lg">
                    <img class="w-full h-182 object-cover rounded-lg" src="/assets/moby.jpg">
                    <div>
                    <h1 class="font-inter font-semibold text-xl text-slate-900">Moby Dick</h1>
                    <h2 class="font-inter font-regular text-sm md:text-xl text-slate-600">Herman Melville</h2>
                    <h3 class=" font-inter font-semibold text-xl md:text-xl text-cyan-900">$12</h3>
                </div>
            </div>
            <div class="bg-white flex-row  p-6  gap-4 mr-70 rounded-lg">
                <img class="w-full h-182 object-cover rounded-lg" src="/assets/frank.jpg">
                <div>
                    <h1 class="font-inter font-semibold text-xl md:text-xl text-slate-900">Frankenstein</h1>
                    <h2 class="font-inter font-regular text-sm md:text-sm text-slate-600">Mary Shelley</h2>
                    <h3 class="font-inter font-semibold text-xl md:text-xl text-cyan-900">$14</h3>
                </div>
            </div>
            <div class="bg-white flex-row  p-6 gap-4 mr-70 rounded-lg">
                <img class="w-full h-182 object-cover rounded-lg" src="/assets/call.jpg">
                <div>
                    <h1 class="font-inter font-semibold text-xl md:text-xl text-slate-900">Call of the Wild</h1>
                    <h2 class="font-inter font-regular text-sm md:text-sm text-slate-600">Jack London</h2>
                    <h3 class="font-inter font-semibold text-xl md:text-xl text-cyan-900">$9</h3>
                </div>
            </div>
        </div>







    </main>

    <footer>

        <div class="flex flex-col bg-teal-700 mt-10 mb-5 rounded-lg w-3xs ml-130 md:ml-85">
            <h2
                class="flex flex-col md:flex-col text-center md:text-center font-inter font-semibold text-lg text-white">
                Browse The Shelves</h2>
        </div>


    </footer>

</body>

</html>
